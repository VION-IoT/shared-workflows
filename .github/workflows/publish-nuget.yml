name: Publish NuGet
# Reusable workflow: build + pack a .NET solution, push intermediate
# packages to the VION private feed, and (on a vX.Y.Z tag) push to
# nuget.org with a long-lived API key.
#
# With `gate: true`, runs the shared build + test + style gate
# (actions/dotnet-gate) in the same job before packing — one build, and a
# release can't ship with failing tests or style drift. Off by default.
#
# Caller is responsible for:
#   - holding AZURE_DEVOPS_PAT and NUGET_API_KEY secrets
#   - passing `secrets: inherit` (or naming each secret explicitly)
#   - granting `contents: read` permission
#   - when `gate: true`: providing scripts/cleanup-code.ps1,
#     .config/dotnet-tools.json, and a .sln.DotSettings cleanup profile
#
# Note: nuget.org Trusted Publishing does not currently work with
# reusable workflows because the OIDC `job_workflow_ref` claim points
# at this repo, not the caller's. See community discussion #179952.
# Using an API key is the pragmatic workaround until that is fixed.

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string
        description: Path to the .sln or .slnx file (relative to repo root)
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      pack-output:
        required: false
        type: string
        default: './artifacts'
      push-to-nuget-org:
        required: false
        type: boolean
        default: true
        description: Push to nuget.org on stable (vX.Y.Z) tag pushes
      gate:
        required: false
        type: boolean
        default: false
        description: >
          Run the build + test + style gate (actions/dotnet-gate) before packing, in
          the same job so pack reuses the one build and a release can't ship with failing
          tests or style drift. Requires the caller to provide scripts/cleanup-code.ps1,
          .config/dotnet-tools.json, and a .sln.DotSettings cleanup profile (see `dale`).
          Off by default so existing consumers are unaffected.
      test-filter:
        required: false
        type: string
        default: ''
        description: >
          Optional VSTest --filter applied to the gate's `dotnet test` (only when gate is
          true). Use to keep environment-dependent tests out of the release gate, e.g.
          'FullyQualifiedName!~IntegrationTest'.
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'
        description: >-
          Runner for the pack/gate job. A single label string (e.g. 'ubuntu-latest', or a
          self-hosted label), or a JSON-array string of labels (e.g. '["self-hosted","linux","x64"]')
          for multi-label self-hosted targeting. Defaults to 'ubuntu-latest' — unchanged for existing callers.
    secrets:
      AZURE_DEVOPS_PAT:
        required: true
      NUGET_API_KEY:
        required: false
        description: nuget.org API key. Required when push-to-nuget-org is true and the run is on a vX.Y.Z tag.

jobs:
  pack:
    # A plain label (default 'ubuntu-latest') is used as-is; a JSON-array string like
    # '["self-hosted","linux","x64"]' is parsed into a label array for self-hosted targeting.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        # Install into a writable, runner-local dir — self-hosted runners often can't write the
        # system default (/usr/share/dotnet), which fails setup-dotnet. Set at step level: the
        # runner context isn't available in job-level env.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # setup-dotnet only adds a custom DOTNET_INSTALL_DIR to PATH on a FRESH install; a self-hosted
      # runner that doesn't wipe runner.temp finds a cached SDK, skips install — and skips the PATH
      # add — so dotnet drops off PATH. Add it explicitly so the job is deterministic.
      - name: Put dotnet on PATH
        shell: bash
        run: echo "${{ runner.temp }}/dotnet" >> "$GITHUB_PATH"

      - id: version
        uses: VION-IoT/shared-workflows/actions/compute-version@v1

      - uses: VION-IoT/shared-workflows/actions/setup-nuget-private-feed@v1
        with:
          pat: ${{ secrets.AZURE_DEVOPS_PAT }}

      # gate: true → build + test + style in one job; pack below reuses this Release build.
      - if: ${{ inputs.gate }}
        uses: VION-IoT/shared-workflows/actions/dotnet-gate@v1
        with:
          solution: ${{ inputs.solution }}
          configuration: Release
          version: ${{ steps.version.outputs.version }}
          test-filter: ${{ inputs.test-filter }}

      # gate: false (default) → plain build, unchanged behavior for existing consumers.
      - name: Build
        if: ${{ !inputs.gate }}
        run: dotnet build "${{ inputs.solution }}" -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: >
          dotnet pack "${{ inputs.solution }}" -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -o "${{ inputs.pack-output }}"

      - name: Push to private feed
        if: github.event_name != 'pull_request'
        run: >
          dotnet nuget push "${{ inputs.pack-output }}/*.nupkg"
          --source PrivateFeed
          --api-key ${{ secrets.AZURE_DEVOPS_PAT }}
          --skip-duplicate

      - name: Push to nuget.org
        if: inputs.push-to-nuget-org && steps.version.outputs.is_release == 'true'
        run: >
          dotnet nuget push "${{ inputs.pack-output }}/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ${{ inputs.pack-output }}/*.*nupkg
