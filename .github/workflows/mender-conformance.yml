name: Mender conformance round-trip
# Reusable workflow: run a caller-supplied round-trip executable against a live Mender server and
# fail the job if it does not complete. The conformance half of the VION Windows CI lane
# (specs/in-flight/2026-08-06-cx5130-windows-gateway.md § Component 1).
#
# ## Why this exists, and why "regenerate and build" is not it
#
# The Mender device client is generated from the published OpenAPI documents. That defends against
# the server's *shape* changing and does nothing about its *encoding*: spike S-1 hit three
# wire-fidelity defects against a completely stable server, and all three compiled perfectly.
# `{"status":"Downloading"}` is a valid C# program and a `400 Invalid Request`. A job that
# regenerates the client and builds it catches none of them. Conformance therefore means
# exercising the real endpoints — and because a regeneration can quietly undo a correction, it has
# to keep doing so on a schedule and on every server upgrade, not once.
#
# ## Reachability — read this before scheduling it
#
# A full round-trip has two halves. They are served by two *hosts* and are reachable from
# different places:
#
#   - **The device API** (`/api/devices/*`) is served by the **device host** — `mender-server-url`
#     — which is device-only and mTLS-gated at the Traefik edge (`RequireAndVerifyClientCert`),
#     but is *not* IP-whitelisted. Authenticate, inventory, deployment poll, status and log
#     reporting are all reachable from an ordinary GitHub-hosted runner, provided it presents a
#     client certificate. A probe holding none never reaches HTTP at all: the edge answers the
#     empty `Certificate` message with TLSv1.3 alert 116 `certificate_required` (curl exit 56).
#     That is the gate *working*, and the preflight below reports it as "reachable and gated".
#   - **The management API** (`/api/management/*`, and `/api/internal/*`, `/ui/*`) is served by a
#     separate **admin host** — `mender-admin-url` — and is **IP-whitelisted** at the edge.
#     Staging a round-trip — opening the commissioning request, uploading the artifact, creating
#     the deployment — goes through it. So does any assertion made by reading the server's view
#     of the result.
#
# One base URL no longer covers both, which is why there are two inputs. `mender-server-url` is
# the device host and stays the URL a caller points its round-trip executable at;
# `mender-admin-url` is the admin host, is read by the preflight only, and is optional — omit it
# and the management half is reported as not probed.
#
# `artifacts-mender` passes that whitelist by running on the org's self-hosted runners, which are
# headless WireGuard peers (labels `self-hosted, vpn, mender-artifact`); their traffic SNATs to
# the hub WireGuard VM, which is what the Traefik IP-whitelist middleware allows. GitHub-hosted
# runners have no route in.
#
# **That mechanism does not transfer to this workflow as it stands: every runner in that fleet is
# Linux** (3× x64, 2× ARM64, verified 2026-08-12), and the round-trip executable is `win-x64`.
# Until a Windows self-hosted runner joins the VPN peer set, a scheduled run of this template can
# exercise the device-API half against a device that was staged out of band, but cannot stage its
# own deployment. The preflight step below probes both halves and writes the result into the job
# summary, so a run that is silently only testing half the contract says so.
#
# Provisioning that runner, or any other route through the whitelist, belongs to
# `environments-iac` — not to this repository and not to its callers.
#
# ## Triggers
#
# This is `workflow_call` only. The caller owns the triggers; the spec asks for
# `schedule` + `workflow_dispatch`:
#
#     on:
#       schedule:    [{ cron: '17 3 * * *' }]
#       workflow_dispatch:
#     jobs:
#       conformance:
#         uses: VION-IoT/shared-workflows/.github/workflows/mender-conformance.yml@v1
#         with:
#           artifact-name: round-trip-win-x64
#           executable: ./vion-agent-spike.exe
#           arguments: run
#           # Two hosts since the device/admin split. Keep the values in repository variables
#           # rather than in workflow source.
#           mender-server-url: ${{ vars.MENDER_TEST_URL }}         # device host, mTLS-gated
#           mender-admin-url: ${{ vars.MENDER_ADMIN_TEST_URL }}    # admin host, IP-whitelisted
#           device-id-environment-variable: VION_AGENT_Agent__Identity__DeviceIdOverride
#         secrets: inherit
#
# Caller is responsible for:
#   - uploading a workflow artifact containing the round-trip executable before calling this
#   - holding the dedicated CI device identity as a secret and passing it as `DEVICE_ID_OVERRIDE`
#   - granting `contents: read`

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
        description: Workflow artifact to download; must contain the round-trip executable
      executable:
        required: true
        type: string
        description: Path to the round-trip executable inside the downloaded artifact (e.g. ./vion-agent-spike.exe)
      arguments:
        required: false
        type: string
        default: ''
        description: Arguments passed to the executable (e.g. 'run')
      mender-server-url:
        required: true
        type: string
        description: >-
          Base URL of the **device** Mender host — the half serving `/api/devices/*`, device-only
          and mTLS-gated at the edge. Used for the device half of the reachability preflight and
          the run summary. The executable reads its own endpoints from `environment` below — this
          workflow does not presume the caller's configuration keys.
      mender-admin-url:
        required: false
        type: string
        default: ''
        description: >-
          Base URL of the **admin** Mender host — the half serving the UI, `/api/management/*`
          and `/api/internal/*` behind the edge IP-whitelist. Read by the management half of the
          reachability preflight and by nothing else. Optional: when it is omitted that half is
          reported as not probed, rather than probed against the device host where — since the
          device/admin split — it would only measure the client-certificate gate a second time.
      environment:
        required: false
        type: string
        default: ''
        description: >-
          Endpoint and runtime configuration for the executable, one NAME=value per line. The
          caller names its own variables; nothing here is interpreted. Example:
          'VION_AGENT_Agent__Mender__ServerUrl=https://mender.test.example'. Endpoints the
          executable talks to are the caller's business: a device round-trip wants the device
          host, which is what `mender-server-url` names.
      device-id-environment-variable:
        required: true
        type: string
        description: >-
          Name of the environment variable the DEVICE_ID_OVERRIDE secret is exported as. Required
          and undefaulted on purpose: the configuration key belongs to the caller's agent, not to
          this workflow. For `vion-agent-windows` it is
          `VION_AGENT_Agent__Identity__DeviceIdOverride`.
      timeout-minutes:
        required: false
        type: number
        default: 30
        description: Hard cap on the round-trip. A deployment poll that never resolves must fail, not hang.
      logs-artifact-name:
        required: false
        type: string
        default: 'mender-conformance-logs'
      runs-on:
        required: false
        type: string
        default: 'windows-latest'
        description: >-
          Runner for the conformance job. A single label string, or a JSON-array string of labels.
          See the reachability section in the header before changing it.
    secrets:
      DEVICE_ID_OVERRIDE:
        required: true
        description: >-
          Device identifier for the dedicated CI device identity. A CI round-trip must never run
          under a real gateway's identifier — it reports deployment status to the server under
          whatever identity it authenticates as.

jobs:
  conformance:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Download the round-trip executable
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: round-trip

      # Probe both halves and record what was actually reachable. A run that can talk to the
      # device API but not the management API is testing half the contract; that has to be visible
      # in the summary rather than inferred from a confusing failure twenty minutes later.
      #
      # Each half is probed in two stages, because on the device host a failed HTTP request has
      # two opposite readings. The client-certificate gate refuses a certificate-less request
      # *below* HTTP — the edge answers the empty `Certificate` message with TLSv1.3 alert 116
      # `certificate_required` — so a healthy gated host and a dead host both fail the request.
      # Opening a TCP connection first is what separates them: port open and no HTTP answer is the
      # gate doing its job; port shut is a genuine no-answer (DNS, routing, a dead edge).
      - name: Preflight — what is reachable from this runner
        shell: pwsh
        env:
          MENDER_SERVER_URL: ${{ inputs.mender-server-url }}
          MENDER_ADMIN_URL: ${{ inputs.mender-admin-url }}
        run: |
          $probeTimeoutSeconds      = 15
          $probeTimeoutMilliseconds = $probeTimeoutSeconds * 1000
          $notProbedCell            = '—'
          # Traefik's IP-whitelist middleware answers a blocked source with 403 before Mender ever
          # sees the request, so "the edge answered" is not the same as "we are allowed in". Only
          # the whitelisted routes can produce 403 that way; read it as blocked there.
          $forbidden = 403

          # Stage one. Does the edge answer at the transport level at all? This is the whole
          # discriminator between a genuine no-answer and a connection that was established and
          # then refused above TCP — which is what an enforced client-certificate gate looks like
          # to a runner holding no certificate.
          function Test-TcpPortOpen {
              param([uri] $Uri, [int] $TimeoutMilliseconds)

              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                  if (-not $client.ConnectAsync($Uri.Host, $Uri.Port).Wait($TimeoutMilliseconds)) {
                      return @{ Open   = $false
                                Reason = "no TCP answer from $($Uri.Host):$($Uri.Port) within $TimeoutMilliseconds ms" }
                  }
                  return @{ Open = $true; Reason = '' }
              }
              catch { return @{ Open = $false; Reason = $_.Exception.GetBaseException().Message } }
              finally { $client.Dispose() }
          }

          # Exception text goes into a Markdown table cell; keep it on one line and neutralise the
          # column separator.
          function Format-Cell {
              param([string] $Text)
              (($Text -replace '\s+', ' ') -replace '\|', '\|').Trim()
          }

          $probes = @(
              @{ Half           = 'device API (mTLS-gated, not IP-whitelisted)'
                 BaseUrl        = $env:MENDER_SERVER_URL
                 Path           = '/api/devices/v1/authentication/auth_requests'
                 AnsweredMeans  = 'reachable, NOT gated — a certificate-less request got an HTTP answer'
                 ForbiddenMeans = 'reachable, rejected by Mender'
                 BelowHttpMeans = 'reachable and gated — certificate-less request refused below HTTP'
                 UnsetMeans     = 'not probed — no device host supplied by the caller' }
              @{ Half           = 'management API (IP-whitelisted)'
                 BaseUrl        = $env:MENDER_ADMIN_URL
                 # deviceauth's real management route. The v1/deviceauth spelling this probe
                 # used before answers 404 from Traefik's fallback, which reads as "the
                 # management API answered" and is not; v2/devauth answers 401 unauthenticated,
                 # which is proof the API itself is behind the edge.
                 Path           = '/api/management/v2/devauth/devices'
                 AnsweredMeans  = 'reachable'
                 ForbiddenMeans = 'BLOCKED by the edge IP-whitelist — this runner is not in the VPN peer set'
                 BelowHttpMeans = 'port open, request refused below HTTP — a TLS or proxy failure, not the IP-whitelist'
                 UnsetMeans     = 'not probed — no admin host supplied by the caller' }
          )

          $rows = foreach ($probe in $probes) {
              if (-not $probe.BaseUrl) {
                  [pscustomobject]@{ Half = $probe.Half; Origin = ''; Result = $probe.UnsetMeans }
                  continue
              }

              $uri    = [uri](($probe.BaseUrl.TrimEnd('/')) + $probe.Path)
              $origin = "$($uri.Scheme)://$($uri.Authority)"

              $transport = Test-TcpPortOpen -Uri $uri -TimeoutMilliseconds $probeTimeoutMilliseconds
              if (-not $transport.Open) {
                  [pscustomobject]@{ Half   = $probe.Half
                                     Origin = $origin
                                     Result = "NO ANSWER — $($transport.Reason)" }
                  continue
              }

              try {
                  $response = Invoke-WebRequest -Uri $uri -Method Head -SkipHttpErrorCheck `
                                                -TimeoutSec $probeTimeoutSeconds
                  $status  = [int]$response.StatusCode
                  $verdict = if ($status -eq $forbidden) { $probe.ForbiddenMeans } else { $probe.AnsweredMeans }
                  [pscustomobject]@{ Half = $probe.Half; Origin = $origin; Result = "$verdict (HTTP $status)" }
              }
              catch {
                  # The port answered, so the edge is alive: the connection was established and
                  # then refused above TCP. What that means differs per half — hence the table.
                  # The exception text rides along because it is the only thing separating the
                  # refusal this row expects (alert 116, no client certificate offered) from one
                  # it does not (an expired or mis-named *server* certificate, which fails at the
                  # same layer and would otherwise read as a healthy gate).
                  [pscustomobject]@{ Half   = $probe.Half
                                     Origin = $origin
                                     Result = "$($probe.BelowHttpMeans) — $($_.Exception.GetBaseException().Message)" }
              }
          }

          "### Mender conformance preflight"                                | Out-File $env:GITHUB_STEP_SUMMARY -Append
          ""                                                                | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "Runner: ``${{ runner.os }}/${{ runner.name }}``"                  | Out-File $env:GITHUB_STEP_SUMMARY -Append
          ""                                                                | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| half | host | result |"                                        | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|---|"                                                   | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($row in $rows) {
              $originCell = if ($row.Origin) { "``$($row.Origin)``" } else { $notProbedCell }
              "| $($row.Half) | $originCell | $(Format-Cell $row.Result) |"  | Out-File $env:GITHUB_STEP_SUMMARY -Append
              Write-Host "$($row.Half) [$originCell]: $($row.Result)"
          }
          ""                                                                | Out-File $env:GITHUB_STEP_SUMMARY -Append
          ("The device host is device-only and demands a client certificate at the TLS layer, so a " +
           "certificate-less probe that never reaches HTTP is the healthy answer, not an outage. The " +
           "management API lives on the admin host and is IP-whitelisted at the Traefik edge; only " +
           "runners inside the VPN peer set reach it.") | Out-File $env:GITHUB_STEP_SUMMARY -Append

          # Deliberately not a gate. The round-trip executable is the gate — it knows which halves
          # it needs. This step exists so its failure is legible.

      - name: Run the round-trip
        shell: pwsh
        working-directory: round-trip
        env:
          EXECUTABLE: ${{ inputs.executable }}
          ARGUMENTS: ${{ inputs.arguments }}
          CALLER_ENVIRONMENT: ${{ inputs.environment }}
          DEVICE_ID_VARIABLE: ${{ inputs.device-id-environment-variable }}
          DEVICE_ID_OVERRIDE: ${{ secrets.DEVICE_ID_OVERRIDE }}
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'mender-conformance.log'
          "CONFORMANCE_LOG=$logPath" | Out-File $env:GITHUB_ENV -Append

          foreach ($line in ($env:CALLER_ENVIRONMENT -split "`n")) {
              $entry = $line.Trim()
              if (-not $entry -or $entry.StartsWith('#')) { continue }
              $separator = $entry.IndexOf('=')
              if ($separator -lt 1) { throw "environment line is not NAME=value: '$entry'" }
              $name  = $entry.Substring(0, $separator).Trim()
              $value = $entry.Substring($separator + 1)
              Set-Item -Path "env:$name" -Value $value
              Write-Host "env $name set"
          }

          # The dedicated CI device identity. Set last so it cannot be shadowed by `environment`.
          Set-Item -Path "env:$($env:DEVICE_ID_VARIABLE)" -Value $env:DEVICE_ID_OVERRIDE
          Write-Host "env $($env:DEVICE_ID_VARIABLE) set from the DEVICE_ID_OVERRIDE secret"

          if (-not (Test-Path -LiteralPath $env:EXECUTABLE)) {
              throw "Round-trip executable '$env:EXECUTABLE' not found in artifact '${{ inputs.artifact-name }}'."
          }
          if (-not $IsWindows) { chmod +x $env:EXECUTABLE }   # upload-artifact drops the exec bit

          $arguments = @($env:ARGUMENTS -split '\s+' | Where-Object { $_ })
          Write-Host "> $env:EXECUTABLE $($arguments -join ' ')"
          $global:LASTEXITCODE = 0
          & $env:EXECUTABLE @arguments 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          Write-Host "round-trip exited $exitCode"
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload the round-trip log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.logs-artifact-name }}
          path: ${{ env.CONFORMANCE_LOG }}
          if-no-files-found: warn
