name: Proof — .NET gate
# In-repo proof for the composite action `actions/dotnet-gate`, run against the fixture under
# tests/fixtures/dotnet-win-x64/ — the only .NET solution in this repository, hence the Windows runner.
#
# What it asserts is `run-style`, from both sides. The job plants a stand-in
# `scripts/cleanup-code.ps1` that records the arguments it was called with. With `run-style: 'false'`
# the gate must finish without calling it; with the input left out it must call it with
# `-Verify -NoBuild`. The second half keeps the first honest: a stand-in that never ran proves nothing
# until the default is seen to reach it.
#
# Tests are off in both runs. This fixture's tests run under Microsoft.Testing.Platform, where the
# gate's `dotnet test` fails (proof-dotnet-win-x64.yml, job `hardcoded-dotnet-test`).
#
# Not covered: `publish-nuget.yml` passing its own `run-style` through. It calls `dotnet-gate@v1`, so
# the input reaches this composite only once `v1` carries it.

on:
  pull_request:
    paths:
      - 'actions/dotnet-gate/**'
      - '.github/workflows/proof-dotnet-gate.yml'
      - 'tests/fixtures/dotnet-win-x64/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-style:
    name: Assert run-style decides whether the style script runs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'

      - name: Put dotnet on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value '${{ runner.temp }}/dotnet'

      - name: Plant a stand-in style script that records its arguments
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path scripts | Out-Null
          Set-Content -LiteralPath scripts/cleanup-code.ps1 -Value @'
          param([switch]$Verify, [switch]$NoBuild)
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'style-ran.txt') -Value "Verify=$Verify NoBuild=$NoBuild"
          '@

      - name: Gate with run-style off
        uses: ./actions/dotnet-gate
        with:
          solution: tests/fixtures/dotnet-win-x64/WindowsServiceFixture.slnx
          run-tests: 'false'
          run-style: 'false'

      - name: The style script must not have run
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'style-ran.txt')) {
              throw "run-style: 'false' still ran scripts/cleanup-code.ps1: $(Get-Content (Join-Path $env:RUNNER_TEMP 'style-ran.txt'))"
          }
          Write-Host 'Confirmed: run-style false skips the style script.'

      - name: Gate with run-style left at its default
        uses: ./actions/dotnet-gate
        with:
          solution: tests/fixtures/dotnet-win-x64/WindowsServiceFixture.slnx
          run-tests: 'false'

      - name: The style script must have run with -Verify -NoBuild
        shell: pwsh
        run: |
          $record = Join-Path $env:RUNNER_TEMP 'style-ran.txt'
          if (-not (Test-Path -LiteralPath $record)) {
              throw 'The default gate never called scripts/cleanup-code.ps1, so the run-style false half above proves nothing.'
          }
          $called = (Get-Content -LiteralPath $record -Raw).Trim()
          if ($called -ne 'Verify=True NoBuild=True') {
              throw "The default gate called scripts/cleanup-code.ps1 with '$called', expected 'Verify=True NoBuild=True'."
          }
          Write-Host 'Confirmed: by default the gate runs the style script with -Verify -NoBuild.'
