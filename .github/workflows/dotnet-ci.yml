name: .NET CI
# Reusable workflow: build + test a .NET solution and verify code style. The actual
# build/test/style steps live in the `actions/dotnet-gate` composite; this workflow is
# the standalone-job wrapper around it (for PR gates and repos that don't publish).
# publish-nuget.yml runs the *same* composite inline before packing, so the PR gate and
# the pre-publish gate can never drift.
#
# The style check runs the caller's `scripts/cleanup-code.ps1 -Verify` — the single
# source of truth that devs/agents run locally (via /cleanup) and ReSharper/Rider apply
# on save — so local and CI can never diverge. The pinned `jb` tool is restored from the
# caller's `.config/dotnet-tools.json`; the cleanup profile lives in the caller's
# `.sln.DotSettings`.
#
# Caller is responsible for:
#   - having `scripts/cleanup-code.ps1`, `.config/dotnet-tools.json`, and a
#     `.sln.DotSettings` cleanup profile (see the `dale` repo for a reference setup)
#   - holding AZURE_DEVOPS_PAT and passing `secrets: inherit` when `private-feed: true`
#   - granting `contents: read`
#
# Opt-in dependency-majors check: `check-dependency-majors: true` adds a second job,
# `dependency-majors`, beside `build-test-style` on the same runner, so a failing build, test or
# style gate does not hide its result. It runs the `actions/dependency-majors` composite over every
# committed `packages.lock.json` and fails when a package or project resolves a dependency at a
# higher major than it declares. It reads the lock files only — no SDK, no restore — and needs
# `pwsh` and `git` on the runner. `dependency-majors-allow-list` names a JSON array of
# `{ package, dependency, declared, resolved, reason }` excusing reviewed edges; an entry that
# matches no edge fails too. With the check off the job is skipped and nothing runs.

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string
        description: Path to the .sln/.slnx (relative to repo root)
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      private-feed:
        required: false
        type: boolean
        default: false
        description: Register the VION private NuGet feed before restore (needs AZURE_DEVOPS_PAT)
      run-tests:
        required: false
        type: boolean
        default: true
        description: Run `dotnet test` after the build
      test-filter:
        required: false
        type: string
        default: ''
        description: Optional VSTest --filter (e.g. 'FullyQualifiedName!~IntegrationTest' to skip integration tests)
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'
        description: >-
          Runner for the build/test/style job. A single label string (e.g. 'ubuntu-latest', or a
          self-hosted label), or a JSON array of labels (e.g. '["self-hosted","linux"]') for
          multi-label self-hosted targeting. Defaults to 'ubuntu-latest' — unchanged for existing callers.
      check-dependency-majors:
        required: false
        type: boolean
        default: false
        description: >-
          Run the `dependency-majors` job, which fails when a package or project in a committed
          packages.lock.json resolves a dependency at a higher major than it declares
      dependency-majors-allow-list:
        required: false
        type: string
        default: ''
        description: >-
          Path, relative to the repo root, of a JSON array of { package, dependency, declared,
          resolved, reason } excusing reviewed edges; empty means no exceptions
    secrets:
      AZURE_DEVOPS_PAT:
        required: false
        description: Azure DevOps PAT with package read access; required when private-feed is true

jobs:
  build-test-style:
    # A plain label (default 'ubuntu-latest') is used as-is; a JSON array string like
    # '["self-hosted","linux"]' is parsed into a label array for multi-label self-hosted targeting.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        # Install .NET into a writable, runner-local dir. Self-hosted runners frequently can't write the
        # system default (/usr/share/dotnet, C:\Program Files\dotnet), which makes setup-dotnet fail before
        # the build starts; runner.temp is always writable. Set at step level: the runner context is not
        # available in job-level env.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # setup-dotnet only adds a custom DOTNET_INSTALL_DIR to PATH on a FRESH install. A self-hosted runner
      # that doesn't wipe runner.temp between jobs finds a cached SDK, skips the install — and skips the PATH
      # add — so dotnet drops off PATH for later steps. Add it explicitly so the gate is deterministic.
      - name: Put dotnet on PATH
        shell: bash
        run: echo "${{ runner.temp }}/dotnet" >> "$GITHUB_PATH"

      - if: ${{ inputs.private-feed }}
        uses: VION-IoT/shared-workflows/actions/setup-nuget-private-feed@v1
        with:
          pat: ${{ secrets.AZURE_DEVOPS_PAT }}

      # Build + test + verify code style. Same composite publish-nuget.yml runs
      # before packing, so the standalone PR gate and the pre-publish gate are identical.
      - uses: VION-IoT/shared-workflows/actions/dotnet-gate@v1
        with:
          solution: ${{ inputs.solution }}
          run-tests: ${{ inputs.run-tests }}
          test-filter: ${{ inputs.test-filter }}

  # Runs beside build-test-style rather than after it, so a failing gate does not hide a drift result.
  dependency-majors:
    if: ${{ inputs.check-dependency-majors }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: VION-IoT/shared-workflows/actions/dependency-majors@v1
        with:
          allow-list: ${{ inputs.dependency-majors-allow-list }}
