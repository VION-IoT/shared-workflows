name: Deploy to AKS
# Reusable workflow: OIDC Azure login -> AKS context -> kubectl set image
# -> rollout wait. Runs on the `[self-hosted, vpn]` runner pool so it can
# reach AKS over VPN.
#
# Configuration convention (caller repo provides these GitHub vars):
#   - Repository-scoped:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   - Environment-scoped (per `inputs.environment`): AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
#
# The shared workflow reads these via `vars.*` from inside the job that
# sets `environment:` — that's the only place environment-scoped vars
# are visible. Callers MUST NOT try to pass them in via `with:`; their
# own caller-job context can't see env-scoped vars.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: GitHub Environment to attach (e.g. "test", "production")
      deployment:
        required: true
        type: string
        description: Kubernetes deployment name (also used as namespace if `namespace` omitted)
      container:
        required: true
        type: string
        description: Container name inside the deployment to update
      image:
        required: true
        type: string
        description: Full image reference (registry/repo:tag)
      namespace:
        required: false
        type: string
        default: ""
        description: Kubernetes namespace; defaults to deployment name
      timeout:
        required: false
        type: string
        default: "5m"

jobs:
  deploy:
    runs-on: [self-hosted, vpn]
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: VION-IoT/shared-workflows/actions/azure-aks-set-image@v1
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          deployment: ${{ inputs.deployment }}
          container: ${{ inputs.container }}
          image: ${{ inputs.image }}
          namespace: ${{ inputs.namespace }}
          timeout: ${{ inputs.timeout }}
