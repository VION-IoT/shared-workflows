name: Smoke Test
# Temporary workflow_call target used to verify that other VION-IoT repos
# (private and public) can invoke a reusable workflow from this private repo.
# Safe to delete once the org's wiring is confirmed.

on:
  workflow_call:
    inputs:
      caller:
        required: false
        type: string
        default: "unknown"

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Smoke test invoked from caller=${{ inputs.caller }} (event=${{ github.event_name }})"
